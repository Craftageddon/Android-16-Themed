<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="224" height="112" viewBox="0 0 224 112"><title>Craftageddon rich forged steel / scalable field</title><desc>Original cold PNG stays unchanged. SVG fixes corners and repeats constant rail cross-sections. Separate neutral runtime light masks; live content not baked.</desc><defs><image id="material-source" href="../source/cold-frame.png" width="2172" height="724" /><image id="material-strip" href="../source/cold-frame.png" width="2172" height="724" image-rendering="optimizeSpeed" /><filter id="soft-spill" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" /></filter><filter id="reflected-light" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5" /></filter></defs><g id="spill" inkscape:groupmode="layer" inkscape:label="spill"><path d="M43 26.3 H181 M43 85.7 H181 M24.5 42 V70 M199.5 42 V70" fill="none" filter="url(#soft-spill)" stroke="white" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round" /></g></svg>