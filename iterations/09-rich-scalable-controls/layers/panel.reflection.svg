<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="224" height="176" viewBox="0 0 224 176"><title>Craftageddon rich forged steel / scalable panel</title><desc>Original cold PNG stays unchanged. SVG fixes corners and repeats constant rail cross-sections. Separate neutral runtime light masks; live content not baked.</desc><defs><image id="material-source" href="../source/cold-frame.png" width="2172" height="724" /><image id="material-strip" href="../source/cold-frame.png" width="2172" height="724" image-rendering="optimizeSpeed" /><filter id="soft-spill" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" /></filter><filter id="reflected-light" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5" /></filter></defs><g id="reflection" inkscape:groupmode="layer" inkscape:label="reflection"><path d="M43 20 H181 M43 156 H181 M18.5 42 V134 M205.5 42 V134" fill="none" filter="url(#reflected-light)" stroke="white" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" /></g></svg>