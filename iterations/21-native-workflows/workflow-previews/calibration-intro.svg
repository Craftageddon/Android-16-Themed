<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><title>Joystick calibration / Intro</title><desc>Source-backed desktop visual fixture. Native callbacks and values are mapped in the adjacent JSON. This is not an Android screenshot, device measurement or runtime acceptance.</desc><rect width="960" height="580" fill="#080c11" /><defs /><text x="24" y="564" font-size="14" font-family="Segoe UI" fill="#8f9ba7" text-anchor="start">Source-backed visual fixture / sample values / not a device screenshot</text><text x="480" y="66" font-size="28" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">Joystick calibration</text><text x="480" y="114" font-size="17" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">This wizard will calibrate your analog sticks:</text><text x="480" y="146" font-size="17" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">1. Center — leave both sticks relaxed</text><text x="480" y="170" font-size="17" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">2–3. Range — rotate each stick in full circles</text><text x="480" y="194" font-size="17" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">4–5. Deadzone — pull and release each stick several times</text><text x="480" y="226" font-size="17" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">Next becomes available when enough data is collected. Choose Next to continue.</text><g opacity="1" data-forge-layer="cold"><image x="432" y="274" width="96" height="56" href="data:image/png;base64," /></g><text x="480.0" y="308" font-size="16" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">Start</text><g opacity="1" data-forge-layer="cold"><image x="424" y="342" width="112" height="56" href="data:image/png;base64," /></g><text x="480.0" y="376" font-size="16" font-family="Segoe UI" fill="#eee7d9" text-anchor="middle">Cancel</text></svg>