<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="288" height="128" viewBox="0 0 288 128"><title>Craftageddon rich forged steel / scalable notification</title><desc>Original cold PNG stays unchanged. SVG fixes corners and repeats constant rail cross-sections. Separate neutral runtime light masks; live content not baked.</desc><defs><image id="material-source" href="../source/cold-frame.png" width="2172" height="724" /><image id="material-strip" href="../source/cold-frame.png" width="2172" height="724" image-rendering="optimizeSpeed" /><filter id="soft-spill" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" /></filter><filter id="reflected-light" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5" /></filter></defs><g id="seam" inkscape:groupmode="layer" inkscape:label="seam"><path d="M43 26.3 H245 M43 101.7 H245 M24.5 42 V86 M263.5 42 V86" fill="none" stroke="white" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" /></g></svg>